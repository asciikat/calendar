<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0a14">
<meta name="description" content="A simple calendar that only shows the days that have something on.">
<title>Easy Cal</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Easy Cal: a plain calendar in the Mission Board night-city style. By default
   it only lists the days that have something on; one switch shows them all. */
:root {
  color-scheme: dark;
  --night: #0d0a14;
  --asphalt: #16111f;
  --asphalt-hi: #1f1830;
  --line: rgba(236, 222, 255, 0.10);
  --ink: #f7f2ff;
  --smog: #a69cbc;
  --dim: #9088a8;
  --shade: #05040a;
  --neon: #ff3d7f;
  --flare: #ff9b3d;
  --gold: #ffd166;
  --palm: #2ee6c8;
  --cash: #7cf29a;
  --dusk: #9a6bff;
  --dusk-ink: #c2a8ff;
  --font-display: "Big Shoulders Display", Impact, "Arial Narrow Bold", sans-serif;
  --font-hud: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --t: var(--dusk-ink);
  --t-bg: rgba(154, 107, 255, .16);
}
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--night); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100dvh;
  background: var(--night);
  color: var(--ink);
  font: 500 16px/1.45 var(--font-body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(110% 55% at 85% -10%, rgba(255, 61, 127, .14), transparent 60%),
    radial-gradient(80% 45% at -10% 0%, rgba(110, 60, 255, .13), transparent 60%);
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--palm); outline-offset: 2px; }
[hidden] { display: none !important; }
svg { display: block; flex: none; }

[data-type="personal"] { --t: var(--dusk-ink); --t-bg: rgba(154, 107, 255, .16); }
[data-type="appointment"] { --t: var(--palm); --t-bg: rgba(46, 230, 200, .13); }
[data-type="health"] { --t: var(--cash); --t-bg: rgba(124, 242, 154, .13); }
[data-type="task"] { --t: var(--gold); --t-bg: rgba(255, 209, 102, .13); }
[data-type="adventure"] { --t: var(--flare); --t-bg: rgba(255, 155, 61, .14); }

.wrap {
  max-width: 920px;
  margin: 0 auto;
  padding: 16px 16px calc(40px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* ── header: the night-city postcard with the add button ─────────────── */
.hero {
  position: relative;
  isolation: isolate;
  min-height: 150px;
  padding: 18px 20px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  overflow: hidden;
  background: #2a1448;
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%);
}
.hero canvas { position: absolute; inset: 0; z-index: -2; width: 100%; height: 100%; }
.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background:
    linear-gradient(90deg, rgba(8, 6, 14, .7) 0%, rgba(8, 6, 14, .15) 60%, transparent 85%),
    linear-gradient(0deg, rgba(8, 6, 14, .55), transparent 60%);
}
.hero h1 {
  margin: 0;
  font: 900 clamp(46px, 10vw, 88px)/.8 var(--font-display);
  text-transform: uppercase;
  transform: skewX(-7deg);
  transform-origin: left bottom;
  filter: drop-shadow(0 4px 0 rgba(5, 4, 10, .9));
}
.hero h1 span {
  background: linear-gradient(100deg, var(--neon) 10%, var(--flare) 90%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.add-btn {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 50px;
  padding: 0 20px 0 16px;
  border: 0;
  background: var(--neon);
  color: var(--shade);
  font: 800 18px/1 var(--font-hud);
  letter-spacing: .1em;
  text-transform: uppercase;
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
}
.add-btn svg { width: 20px; height: 20px; }
.add-btn:hover { filter: brightness(1.08); }
.add-btn:focus-visible { outline: none; box-shadow: inset 0 0 0 3px var(--shade), inset 0 0 0 5px var(--ink); }

/* ── month bar ───────────────────────────────────────────────────────── */
.bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 14px;
  padding: 12px;
  background: var(--asphalt);
  border: 1px solid var(--line);
}
.nav { display: flex; align-items: center; gap: 6px; }
.icon-btn, .btn {
  min-width: 44px;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 0 12px;
  border: 1px solid rgba(255, 255, 255, .18);
  background: rgba(255, 255, 255, .04);
  color: var(--ink);
  font: 800 14px/1 var(--font-hud);
  letter-spacing: .12em;
  text-transform: uppercase;
}
.icon-btn { padding: 0; }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn:hover, .btn:hover { border-color: rgba(255, 255, 255, .36); }
.btn.is-here { border-color: var(--neon); color: var(--neon); }
.month-title { margin: 0 4px; min-width: 7.5em; font: 900 30px/1 var(--font-display); text-transform: uppercase; text-align: center; }
.switch {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
  padding: 4px 14px 4px 8px;
  border: 1px solid var(--line);
  background: none;
  color: var(--ink);
  font: 800 14px/1 var(--font-hud);
  letter-spacing: .12em;
  text-transform: uppercase;
}
.track { position: relative; width: 44px; height: 26px; border-radius: 13px; background: rgba(255, 255, 255, .12); transition: background .2s; }
.track::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--dusk-ink);
  transition: transform .2s, background .2s;
}
.switch[aria-checked="true"] .track { background: rgba(124, 242, 154, .32); }
.switch[aria-checked="true"] .track::after { transform: translateX(18px); background: var(--cash); }

.views {
  flex-basis: 100%;
  display: grid;
  grid-template-columns: repeat(8, minmax(0, 1fr));
  gap: 1px;
  border: 1px solid var(--line);
  background: var(--line);
}
.views button {
  position: relative;
  min-height: 44px;
  padding: 0 4px;
  border: 0;
  background: var(--asphalt);
  color: var(--smog);
  font: 800 14px/1 var(--font-hud);
  letter-spacing: .08em;
  text-transform: uppercase;
  white-space: nowrap;
}
.views button:hover { color: var(--ink); }
.views button[aria-pressed="true"] { color: var(--ink); background: color-mix(in srgb, var(--neon) 12%, var(--asphalt)); }
.views button[aria-pressed="true"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 0; height: 3px; background: var(--neon); }
.month-head { margin: 14px 0 0; font: 900 22px/1 var(--font-display); text-transform: uppercase; color: var(--dusk-ink); }
.month-head:first-child { margin-top: 0; }
.stack { display: flex; flex-direction: column; gap: 18px; }
.cell-mon { font: 800 10px/1 var(--font-hud); letter-spacing: .1em; text-transform: uppercase; color: var(--smog); }

/* 6 months and a year: small month cards, event days lit up */
.minis { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.mini { padding: 10px; border: 1px solid var(--line); background: var(--asphalt); }
.mini.is-now { border-color: rgba(255, 61, 127, .55); }
.mini-title { display: block; width: 100%; min-height: 40px; padding: 0; border: 0; background: none; color: var(--ink); font: 900 20px/1 var(--font-display); text-transform: uppercase; text-align: left; }
.mini-title:hover { color: var(--neon); }
.mini-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.mini-wd { padding-bottom: 3px; font: 700 10px/1 var(--font-hud); text-align: center; color: var(--dim); }
.md { position: relative; aspect-ratio: 1; min-width: 24px; display: grid; place-items: center; padding: 0; border: 0; background: none; color: var(--dim); font: 700 12px/1 var(--font-hud); }
.md.has { color: var(--ink); background: var(--t-bg); }
.md.has::after { content: ""; position: absolute; bottom: 2px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--t); }
.md.is-today { background: var(--neon); color: var(--shade); }
.md:hover { background: rgba(255, 255, 255, .1); color: var(--ink); }

/* ── list of event days ──────────────────────────────────────────────── */
.days { display: flex; flex-direction: column; gap: 8px; }
.day { display: grid; grid-template-columns: 84px minmax(0, 1fr); border: 1px solid var(--line); background: var(--asphalt); }
.day.is-today { border-color: var(--neon); box-shadow: inset 3px 0 0 var(--neon); }
.day.is-past { opacity: .7; }
.day-date {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 3px;
  padding: 10px 12px;
  border-right: 1px solid var(--line);
  background: rgba(5, 4, 10, .35);
}
.day-wd { font: 800 11px/1 var(--font-hud); letter-spacing: .16em; text-transform: uppercase; color: var(--smog); }
.is-today .day-wd { color: var(--neon); }
.day-num { font: 900 40px/.9 var(--font-display); }
.events { list-style: none; margin: 0; padding: 6px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.event {
  display: grid;
  grid-template-columns: 80px minmax(0, 1fr);
  align-items: center;
  gap: 8px;
  width: 100%;
  min-height: 48px;
  padding: 6px 10px 6px 0;
  border: 0;
  border-left: 3px solid var(--t);
  background: var(--t-bg);
  color: var(--ink);
  text-align: left;
}
.event:hover { filter: brightness(1.15); }
.event-time { padding-left: 10px; font: 800 13px/1.15 var(--font-hud); letter-spacing: .08em; text-transform: uppercase; color: var(--t); }
.event-title { font: 700 16px/1.25 var(--font-body); overflow-wrap: anywhere; }
.empty {
  padding: 34px 18px;
  border: 1px dashed rgba(255, 255, 255, .16);
  text-align: center;
  color: var(--smog);
}
.empty b { display: block; margin-bottom: 6px; font: 900 30px/1 var(--font-display); text-transform: uppercase; color: var(--ink); }

/* ── full month grid ─────────────────────────────────────────────────── */
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); background: var(--asphalt); }
.wd { padding: 8px 6px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); font: 800 11px/1 var(--font-hud); letter-spacing: .14em; text-transform: uppercase; color: var(--smog); }
.cell {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
  min-height: 104px;
  padding: 4px;
  border: 0;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  background: none;
  color: var(--ink);
  text-align: left;
}
.cell.blank { background: repeating-linear-gradient(135deg, transparent 0 8px, rgba(255, 255, 255, .015) 8px 16px); }
.cell-num {
  align-self: flex-end;
  min-width: 34px;
  min-height: 30px;
  padding: 4px 6px;
  border: 0;
  background: none;
  color: var(--ink);
  font: 800 17px/1 var(--font-display);
  text-align: right;
}
.cell-num:hover { background: rgba(255, 255, 255, .08); }
.cell.empty-day .cell-num { color: var(--dim); }
.cell.is-past { background: rgba(5, 4, 10, .35); }
.cell.is-today { box-shadow: inset 0 0 0 2px var(--neon); }
.cell.is-today .cell-num { background: var(--neon); color: var(--shade); }
.chip {
  display: flex;
  gap: 5px;
  width: 100%;
  min-height: 24px;
  padding: 3px 6px;
  border: 0;
  border-left: 3px solid var(--t);
  background: var(--t-bg);
  color: var(--ink);
  font: 600 12px/1.2 var(--font-body);
  text-align: left;
  overflow: hidden;
}
.chip em { flex: none; font: 800 11px/1.2 var(--font-hud); font-style: normal; color: var(--t); }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip:hover { filter: brightness(1.2); }
.more { padding: 2px 4px; border: 0; background: none; color: var(--smog); font: 700 11px/1.2 var(--font-hud); text-transform: uppercase; text-align: left; }

/* ── footer ──────────────────────────────────────────────────────────── */
.sync { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; width: 100%; }
.sync-status { font-size: 12px; color: var(--smog); }
.foot { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding-top: 6px; }
.link { min-height: 44px; padding: 0 10px; border: 0; background: none; color: var(--smog); font: 700 13px/1 var(--font-hud); letter-spacing: .12em; text-transform: uppercase; text-decoration: underline; text-underline-offset: 4px; }
.link:hover { color: var(--ink); }

/* ── the form ────────────────────────────────────────────────────────── */
dialog {
  width: min(500px, calc(100% - 24px));
  max-height: calc(100dvh - 24px);
  padding: 0;
  border: 1px solid rgba(255, 255, 255, .14);
  background: var(--asphalt);
  color: var(--ink);
}
dialog::backdrop { background: rgba(5, 4, 10, .78); }
form { display: flex; flex-direction: column; gap: 14px; padding: 20px; }
.form-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.form-head h2 { margin: 0; font: 900 38px/.9 var(--font-display); text-transform: uppercase; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font: 800 12px/1.2 var(--font-hud); letter-spacing: .16em; text-transform: uppercase; color: var(--smog); }
.field small { font: 500 12px var(--font-body); letter-spacing: 0; text-transform: none; color: var(--dim); }
.field input, .field select {
  width: 100%;
  min-height: 48px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 0;
  background: var(--asphalt-hi);
  color: var(--ink);
  font: 600 16px/1.2 var(--font-body);
  color-scheme: dark;
}
.field input:focus, .field select:focus { outline: none; border-color: var(--neon); }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.err { min-height: 1em; margin: 0; color: var(--gold); font: 600 14px/1.3 var(--font-body); }
.form-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; padding-top: 14px; border-top: 1px solid var(--line); }
.form-foot > div { display: flex; gap: 8px; }
.btn--primary { border: 0; background: var(--neon); color: var(--shade); padding: 0 20px; }
.btn--primary:focus-visible { outline: none; box-shadow: inset 0 0 0 3px var(--shade), inset 0 0 0 5px var(--ink); }
.btn--quiet { border-color: transparent; background: none; color: var(--smog); }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  z-index: 50;
  display: flex;
  align-items: center;
  gap: 12px;
  width: max-content;
  max-width: calc(100vw - 32px);
  padding: 8px 8px 8px 16px;
  border: 1px solid rgba(255, 255, 255, .16);
  border-left: 4px solid var(--palm);
  background: var(--asphalt-hi);
  box-shadow: 0 12px 30px rgba(0, 0, 0, .55);
  font: 600 15px/1.3 var(--font-body);
  transform: translateX(-50%);
}

/* embedded inside another app (Mission Possible's Calendar tab): no banner, no
   footer, see-through background so the host's panel colour shows */
.embed body { background: transparent; }
.embed body::before { display: none; }
.embed .wrap { padding: 12px; gap: 12px; max-width: none; }
.embed .hero { min-height: 0; padding: 0; background: none; clip-path: none; justify-content: flex-end; }
.embed .hero canvas, .embed .hero h1, .embed .hero::before { display: none; }
.embed .foot .link:not(#sync-btn) { display: none; }
.embed .foot { padding: 0; }
.embed .bar { background: var(--asphalt-hi); }

@media (max-width: 640px) {
  .wrap { padding: 12px 12px 32px; gap: 12px; }
  .hero { min-height: 112px; padding: 12px; }
  .hero h1 { font-size: 42px; }
  .add-btn { min-height: 46px; padding: 0 14px 0 12px; font-size: 16px; }
  .month-title { font-size: 26px; min-width: 0; }
  .views { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .views button { font-size: 13px; letter-spacing: .04em; }
  .switch { margin-left: 0; }
  .day { grid-template-columns: 64px minmax(0, 1fr); }
  .day-num { font-size: 32px; }
  .event { grid-template-columns: 64px minmax(0, 1fr); }
  .cell { min-height: 62px; padding: 2px; }
  .cell-num { font-size: 15px; min-width: 26px; padding: 4px; }
  .wd { padding: 6px 2px; text-align: center; letter-spacing: .04em; }
  /* on a phone the grid shows colour bars; tap the day to see them in a list */
  .chip { min-height: 7px; height: 7px; padding: 0; border: 0; background: var(--t); pointer-events: none; }
  .chip em, .chip span { display: none; }
  .more { font-size: 10px; padding: 0 2px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}
</style>
</head>
<body>
<main class="wrap">
  <header class="hero">
    <canvas id="sky" aria-hidden="true"></canvas>
    <h1>Easy <span>Cal</span></h1>
    <button class="add-btn" type="button" id="add-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Add event
    </button>
  </header>

  <div class="bar">
    <div class="nav">
      <button class="icon-btn" type="button" id="prev" aria-label="Previous month">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h2 class="month-title" id="month-title" aria-live="polite"></h2>
      <button class="icon-btn" type="button" id="next" aria-label="Next month">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <button class="btn" type="button" id="today">Today</button>
    </div>
    <button class="switch" type="button" id="all-days" role="switch" aria-checked="false">
      <span class="track" aria-hidden="true"></span>Show all days
    </button>
    <div class="views" id="views" role="group" aria-label="How much to show">
      <button type="button" data-view="day">Day</button>
      <button type="button" data-view="week">Week</button>
      <button type="button" data-view="week2">2 weeks</button>
      <button type="button" data-view="month">Month</button>
      <button type="button" data-view="month2">2 months</button>
      <button type="button" data-view="month3">3 months</button>
      <button type="button" data-view="month6">6 months</button>
      <button type="button" data-view="year">Year</button>
    </div>
  </div>

  <section id="cal" aria-label="Calendar"></section>

  <footer class="foot">
    <button class="link" type="button" id="backup-save">Save backup</button>
    <button class="link" type="button" id="backup-load">Load backup</button>
    <input type="file" id="backup-file" accept="application/json,.json" hidden>
    <span class="sync" id="sync-box" hidden>
      <button class="link" type="button" id="sync-btn">Sign in to sync</button>
      <span class="sync-status" id="sync-status" role="status" aria-live="polite"></span>
    </span>
  </footer>
</main>

<dialog id="dlg" aria-labelledby="dlg-title">
  <form id="form" novalidate>
    <div class="form-head">
      <h2 id="dlg-title">New event</h2>
      <button class="icon-btn" type="button" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <label class="field"><span>What's on?</span><input name="title" maxlength="200" placeholder="e.g. Dentist" autocomplete="off"></label>
    <div class="row">
      <label class="field"><span>Date</span><input type="date" name="date"></label>
      <label class="field"><span>End date <small>optional</small></span><input type="date" name="endDate"></label>
    </div>
    <div class="row">
      <label class="field"><span>Time <small>optional</small></span><input type="time" name="time"></label>
      <label class="field"><span>Colour</span>
        <select name="type">
          <option value="personal">Purple · Personal</option>
          <option value="appointment">Teal · Appointment</option>
          <option value="health">Green · Health</option>
          <option value="task">Yellow · To do</option>
          <option value="adventure">Orange · Fun</option>
        </select>
      </label>
    </div>
    <p class="err" id="err" role="alert"></p>
    <div class="form-foot">
      <div><button class="btn btn--quiet" type="button" id="delete">Delete</button></div>
      <div>
        <button class="btn" type="button" data-close>Cancel</button>
        <button class="btn btn--primary" type="submit">Save</button>
      </div>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="core.js"></script>
<!-- Optional cloud sync settings; see firebase-config.js. Missing file = sync stays off. -->
<script src="firebase-config.js"></script>
<script src="sync.js"></script>
<script>
(() => {
  'use strict';
  const C = window.EasyCore;
  const $ = (id) => document.getElementById(id);
  if (new URLSearchParams(location.search).get('embed') === '1') document.documentElement.classList.add('embed');
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (ch) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const todayISO = () => C.toISO(new Date());
  const WEEK_START = 1; // Monday

  let storage = null;
  try {
    localStorage.setItem('__probe', '1');
    localStorage.removeItem('__probe');
    storage = localStorage;
  } catch (e) { storage = null; }
  const store = C.createStore({ storage, key: 'easycal.simple.v1' });

  const VIEW_KEYS = ['day', 'week', 'week2', 'month', 'month2', 'month3', 'month6', 'year'];
  const PERIOD = { day: 'today', week: 'this week', week2: 'these two weeks', month: 'this month', month2: 'these two months', month3: 'these three months', month6: 'these six months', year: 'this year' };
  const ui = { anchor: todayISO(), editId: null };
  const view = () => (VIEW_KEYS.includes(store.settings().view) ? store.settings().view : 'month');
  const range = () => C.rangeFor(view(), ui.anchor, WEEK_START);

  function timeLabel(it, o) {
    if (o.dayCount > 1) return `${o.dayIndex} of ${o.dayCount}`;
    return it.time ? C.fmtTime(C.timeToMin(it.time)) : 'All day';
  }
  function titleFor(v, r) {
    const a = C.fromISO(r.start);
    const b = C.fromISO(r.end);
    const sameYear = a.getFullYear() === b.getFullYear();
    if (v === 'day') return C.fmtDateLong(r.start);
    if (v === 'week' || v === 'week2') {
      return `${a.getDate()} ${C.MON_SHORT[a.getMonth()]} – ${b.getDate()} ${C.MON_SHORT[b.getMonth()]}${sameYear ? '' : ` ${b.getFullYear()}`}`;
    }
    if (v === 'month') return `${C.MON_LONG[a.getMonth()]} ${a.getFullYear()}`;
    if (v === 'year') return String(a.getFullYear());
    return sameYear
      ? `${C.MON_SHORT[a.getMonth()]} – ${C.MON_SHORT[b.getMonth()]} ${b.getFullYear()}`
      : `${C.MON_SHORT[a.getMonth()]} ${a.getFullYear()} – ${C.MON_SHORT[b.getMonth()]} ${b.getFullYear()}`;
  }

  // ── the calendar ───────────────────────────────────────────────────────
  function render() {
    const v = view();
    const r = range();
    const today = todayISO();
    $('month-title').textContent = titleFor(v, r);
    $('today').classList.toggle('is-here', r.start <= today && today <= r.end);
    document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === v)));
    const showAll = !!store.settings().full;
    $('all-days').setAttribute('aria-checked', String(showAll));

    const byDay = new Map();
    C.occurrences(store.all(), r.start, r.end).forEach((o) => {
      if (!byDay.has(o.iso)) byDay.set(o.iso, []);
      byDay.get(o.iso).push(o);
    });

    let html;
    if (!showAll || v === 'day') html = list(byDay, today, v);
    else if (v === 'week' || v === 'week2') html = weekGrid(r, byDay, today);
    else if (v === 'month6' || v === 'year') html = minis(r, byDay, today);
    else {
      html = '<div class="stack">';
      for (let m = r.start; m <= r.end; m = C.addMonths(m, 1)) html += monthGrid(m, byDay, today, v !== 'month');
      html += '</div>';
    }
    $('cal').innerHTML = html;
  }

  // only the days that have something on
  function list(byDay, today, v) {
    if (!byDay.size) {
      return `<div class="empty"><b>Nothing on</b>No events ${v === 'day' && ui.anchor !== today ? 'on this day' : PERIOD[v]}. Tap <strong>Add event</strong> to add one.</div>`;
    }
    const heads = v !== 'day' && v !== 'week';
    let lastMonth = '';
    let html = '<div class="days">';
    byDay.forEach((occ, iso) => {
      const d = C.fromISO(iso);
      if (heads && iso.slice(0, 7) !== lastMonth) {
        lastMonth = iso.slice(0, 7);
        html += `<h3 class="month-head">${C.MON_LONG[d.getMonth()]} ${d.getFullYear()}</h3>`;
      }
      const cls = ['day'];
      if (iso === today) cls.push('is-today');
      if (iso < today) cls.push('is-past');
      html += `<div class="${cls.join(' ')}">
        <div class="day-date"><span class="day-wd">${iso === today ? 'Today' : C.WD_SHORT[d.getDay()]}</span><span class="day-num">${d.getDate()}</span></div>
        <ul class="events">${occ.map((o) => `<li><button class="event" type="button" data-type="${o.item.type}" data-id="${esc(o.item.id)}">
          <span class="event-time">${timeLabel(o.item, o)}</span><span class="event-title">${esc(o.item.title)}</span></button></li>`).join('')}</ul>
      </div>`;
    });
    return `${html}</div>`;
  }

  function cell(iso, byDay, today, label) {
    const occ = byDay.get(iso) || [];
    const d = C.fromISO(iso);
    const cls = ['cell'];
    if (iso === today) cls.push('is-today');
    if (iso < today) cls.push('is-past');
    if (!occ.length) cls.push('empty-day');
    const chips = occ.slice(0, 3).map((o) => {
      const t = o.dayCount > 1 ? '' : o.item.time ? `<em>${C.fmtTime(C.timeToMin(o.item.time))}</em>` : '';
      return `<button class="chip" type="button" data-type="${o.item.type}" data-id="${esc(o.item.id)}" title="${esc(o.item.title)}">${t}<span>${esc(o.item.title)}</span></button>`;
    }).join('');
    const more = occ.length > 3 ? `<span class="more">+${occ.length - 3} more</span>` : '';
    return `<div class="${cls.join(' ')}">
      <button class="cell-num" type="button" data-day="${iso}" aria-label="${C.fmtDateLong(iso)}${iso === today ? ', today' : ''}${occ.length ? `, ${occ.length} event${occ.length > 1 ? 's' : ''}` : ''}. Add an event">${label ? `<span class="cell-mon">${C.MON_SHORT[d.getMonth()]} </span>` : ''}${d.getDate()}</button>
      ${chips}${more}</div>`;
  }
  function weekdayHeads() {
    let html = '';
    for (let i = 0; i < 7; i++) html += `<div class="wd">${C.WD_SHORT[(WEEK_START + i) % 7]}</div>`;
    return html;
  }

  // a week or two: one row per week
  function weekGrid(r, byDay, today) {
    let html = `<div class="grid">${weekdayHeads()}`;
    for (let iso = r.start, i = 0; iso <= r.end; iso = C.addDays(iso, 1), i++) {
      html += cell(iso, byDay, today, i === 0 || iso.endsWith('-01'));
    }
    return `${html}</div>`;
  }

  // a month as a grid
  function monthGrid(start, byDay, today, withTitle) {
    const d0 = C.fromISO(start);
    const y = d0.getFullYear();
    const m = d0.getMonth() + 1;
    const days = C.daysInMonth(y, m);
    const lead = (d0.getDay() - WEEK_START + 7) % 7;
    let html = `<div class="grid">${weekdayHeads()}`;
    for (let i = 0; i < lead; i++) html += '<div class="cell blank" aria-hidden="true"></div>';
    for (let day = 1; day <= days; day++) html += cell(`${y}-${C.pad2(m)}-${C.pad2(day)}`, byDay, today, false);
    const tail = (7 - ((lead + days) % 7)) % 7;
    for (let i = 0; i < tail; i++) html += '<div class="cell blank" aria-hidden="true"></div>';
    html += '</div>';
    return withTitle ? `<section><h3 class="month-head">${C.MON_LONG[m - 1]} ${y}</h3>${html}</section>` : html;
  }

  // six months or a year: small month cards; tap a day to add, a month name to open it
  function minis(r, byDay, today) {
    const heads = Array.from({ length: 7 }, (_, i) => `<span class="mini-wd">${C.WD_SHORT[(WEEK_START + i) % 7].charAt(0)}</span>`).join('');
    let html = '<div class="minis">';
    for (let m0 = r.start; m0 <= r.end; m0 = C.addMonths(m0, 1)) {
      const d0 = C.fromISO(m0);
      const y = d0.getFullYear();
      const m = d0.getMonth() + 1;
      const lead = (d0.getDay() - WEEK_START + 7) % 7;
      let cells = heads + '<span></span>'.repeat(lead);
      for (let day = 1; day <= C.daysInMonth(y, m); day++) {
        const iso = `${y}-${C.pad2(m)}-${C.pad2(day)}`;
        const occ = byDay.get(iso) || [];
        const cls = ['md'];
        if (occ.length) cls.push('has');
        if (iso === today) cls.push('is-today');
        const names = occ.map((o) => o.item.title).join(', ');
        cells += `<button class="${cls.join(' ')}" type="button" ${occ.length ? `data-type="${occ[0].item.type}" title="${esc(names)}"` : ''} data-mini="${iso}" aria-label="${C.fmtDateLong(iso)}${occ.length ? `: ${esc(names)}` : ''}">${day}</button>`;
      }
      html += `<div class="mini ${today.slice(0, 7) === m0.slice(0, 7) ? 'is-now' : ''}">
        <button class="mini-title" type="button" data-open-month="${m0}">${C.MON_LONG[m - 1]}${m === 1 || m0 === r.start ? ` <span style="color:var(--dim)">${y}</span>` : ''}</button>
        <div class="mini-grid">${cells}</div></div>`;
    }
    return `${html}</div>`;
  }

  $('cal').addEventListener('click', (e) => {
    const ev = e.target.closest('[data-id]');
    if (ev) { openForm(ev.dataset.id); return; }
    const day = e.target.closest('[data-day]');
    if (day) { openForm(null, day.dataset.day); return; }
    // in the small month cards, a day with events opens its week; an empty day adds one
    const md = e.target.closest('[data-mini]');
    if (md) {
      if (md.classList.contains('has')) {
        ui.anchor = md.dataset.mini;
        store.setSettings({ view: 'week', full: false });
      } else openForm(null, md.dataset.mini);
      return;
    }
    const month = e.target.closest('[data-open-month]');
    if (month) {
      ui.anchor = month.dataset.openMonth;
      store.setSettings({ view: 'month' });
    }
  });
  document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => {
    // keep looking at roughly the same time: today if it's in view, else the start of what's shown
    const r = range();
    const today = todayISO();
    ui.anchor = r.start <= today && today <= r.end ? today : r.start;
    store.setSettings({ view: b.dataset.view });
  }));
  $('prev').addEventListener('click', () => { ui.anchor = C.stepAnchor(view(), ui.anchor, -1, todayISO(), WEEK_START); render(); });
  $('next').addEventListener('click', () => { ui.anchor = C.stepAnchor(view(), ui.anchor, 1, todayISO(), WEEK_START); render(); });
  $('today').addEventListener('click', () => { ui.anchor = todayISO(); render(); });
  $('all-days').addEventListener('click', () => store.setSettings({ full: !store.settings().full }));
  store.subscribe(render);

  // ── add / edit form ────────────────────────────────────────────────────
  const dlg = $('dlg');
  const form = $('form');
  function openForm(id, date) {
    const it = id ? store.get(id) : null;
    ui.editId = it ? it.id : null;
    form.title.value = it ? it.title : '';
    form.date.value = it ? it.date : (date || todayISO());
    form.endDate.value = (it && it.endDate) || '';
    form.time.value = (it && it.time) || '';
    form.type.value = it ? it.type : 'personal';
    $('dlg-title').textContent = it ? 'Edit event' : 'New event';
    $('delete').hidden = !it;
    $('err').textContent = '';
    dlg.showModal();
    form.title.focus();
  }
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const title = form.title.value.trim();
    const date = form.date.value;
    let endDate = form.endDate.value || null;
    if (!title) { $('err').textContent = 'Give it a name.'; form.title.focus(); return; }
    if (!date) { $('err').textContent = 'Pick a date.'; form.date.focus(); return; }
    if (endDate && endDate < date) { $('err').textContent = 'The end date is before the start date.'; return; }
    if (endDate === date) endDate = null;
    const fields = { title, date, endDate, time: form.time.value || null, type: form.type.value };
    if (ui.editId) store.update(ui.editId, fields);
    else store.add(fields);
    // if the event is outside what's on screen, jump there so you see it land
    const r = range();
    if (date < r.start || date > r.end) ui.anchor = date;
    dlg.close();
    render();
    toast(ui.editId ? 'Saved.' : `Added “${title}”.`);
  });
  $('delete').addEventListener('click', () => {
    const it = ui.editId && store.get(ui.editId);
    if (!it) return;
    store.remove(it.id);
    dlg.close();
    toast(`Deleted “${it.title}”.`, () => store.restore(it.id));
  });
  dlg.addEventListener('click', (e) => {
    if (e.target.closest('[data-close]') || e.target === dlg) dlg.close();
  });
  $('add-btn').addEventListener('click', () => openForm(null));

  // ── toast ──────────────────────────────────────────────────────────────
  let toastTimer = 0;
  function toast(msg, undo) {
    const el = $('toast');
    el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button class="btn" type="button">Undo</button>' : ''}`;
    if (undo) el.querySelector('button').addEventListener('click', () => { undo(); el.hidden = true; });
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; el.innerHTML = ''; }, undo ? 6000 : 2500);
  }

  // ── backup ─────────────────────────────────────────────────────────────
  $('backup-save').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(store.exportData(), null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `easy-cal-backup-${todayISO()}.json`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  });
  $('backup-load').addEventListener('click', () => $('backup-file').click());
  $('backup-file').addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      const r = store.importData(JSON.parse(await file.text()));
      toast(`Loaded: ${r.added} new, ${r.updated} updated.`);
    } catch (err) {
      toast('That file isn’t an Easy Cal backup.');
    }
  });

  // ── the night-city sky (same painter as Mission Board) ─────────────────
  function paintSky() {
    const cv = $('sky');
    const w = Math.max(1, Math.round(cv.getBoundingClientRect().width));
    const h = Math.max(1, Math.round(cv.getBoundingClientRect().height));
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    let seed = 2026;
    const rnd = () => {
      seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    const sky = c.createLinearGradient(0, 0, 0, h);
    ['#04030c', '#0f0b2a', '#26134a', '#4a1c5e'].forEach((col, i) => sky.addColorStop(i / 3, col));
    c.fillStyle = sky;
    c.fillRect(0, 0, w, h);
    for (let i = 0; i < 80; i++) {
      c.fillStyle = `rgba(255,255,255,${0.2 + rnd() * 0.6})`;
      c.fillRect(rnd() * w, rnd() * h * 0.6, 1, 1);
    }
    c.fillStyle = '#ece4ff';
    c.beginPath();
    c.arc(w * 0.74, h * 0.26, Math.min(h * 0.14, 34), 0, Math.PI * 2);
    c.fill();
    const skyline = (color, minH, maxH, windows) => {
      let x = -8;
      while (x < w + 8) {
        const bw = 18 + rnd() * 44;
        const bh = h * (minH + rnd() * (maxH - minH));
        c.fillStyle = color;
        c.fillRect(x, h - bh, bw + 1, bh);
        if (windows) {
          for (let wy = h - bh + 6; wy < h - 6; wy += 7) {
            for (let wx = x + 4; wx < x + bw - 5; wx += 6) {
              if (rnd() < windows) {
                c.fillStyle = rnd() < 0.86 ? `rgba(255,212,140,${0.45 + rnd() * 0.5})` : 'rgba(255,110,170,.85)';
                c.fillRect(wx, wy, 2.5, 3.5);
              }
            }
          }
        }
        x += bw;
      }
    };
    skyline('#1d1538', 0.25, 0.6, 0);
    skyline('#07050e', 0.12, 0.38, 0.45);
  }
  if ('ResizeObserver' in window) new ResizeObserver(paintSky).observe(document.querySelector('.hero'));
  else paintSky();

  render();
  if (window.EasySync) {
    EasySync.attach({ store, toast, box: $('sync-box'), statusEl: $('sync-status'), btn: $('sync-btn') });
  }
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
